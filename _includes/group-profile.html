{% assign lang = include.lang %}
<div class="group-intro" id="page-info">
  <h1 id="{% if lang == 'zh' %}cn{% else %}en{% endif %}-students-title">{{ page.title | escape }}</h1>
  <p>
    {% if lang == 'zh' %}团队负责人{% else %}Principal Investigator{% endif %}
    <span aria-hidden="true">·</span>
    <a id="group-profile-name" href="{{ site.data.page_editions.home[lang] | relative_url }}">{{ site.data.group_profile[lang].name | escape }}{% if lang == 'zh' %}教授{% endif %}</a>
  </p>
  <span class="group-intro-photo" aria-hidden="true">
    <img src="{{ '/assets/res/user.png' | relative_url }}" alt="" width="44" height="44">
  </span>
</div>
