<div class="archive-filters" role="navigation" aria-label="{% if include.lang == 'zh' %}新闻分类{% else %}News categories{% endif %}">
  {% for item in site.data.page_editions %}
    {% assign tab = item[1] %}
    {% if tab.filter %}
    <a href="{{ tab[include.lang] | relative_url }}" data-filter="{{ tab.filter }}"{% if item[0] == page.news_archive %} aria-current="page"{% endif %}>{{ tab.label[include.lang] | escape }}</a>
    {% endif %}
  {% endfor %}
</div>
