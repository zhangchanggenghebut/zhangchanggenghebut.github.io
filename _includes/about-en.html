<div class="col s12 cat-div">
  <style>
        .user-profile {
            display: flex;
            align-items: flex-start; /* Align items to the top */
            gap: 20px; /* Space between image and content */
            padding: 20px;
        }

        .user-pic {
            width: 200px; /* Adjust as needed */
            height: 200px; /* Adjust as needed */
        }
        .user-pic img {
            width: 100%;
            height: 100%;
            border-radius: 50%; /* Optional: Make the image circular */
            object-fit: cover; /* Ensure image fills the space without distortion */
        }

        .user-content {
            flex-grow: 1; /* Allow content to take up remaining space */
        }

        /* Responsive adjustments for smaller screens */
        @media (max-width: 1800px) {
            .user-profile {
                flex-direction: column; /* Stack image and content vertically */
                align-items: center; /* Center content horizontally */
            }
            .user-pic {
                margin-bottom: 10px; /* Add spacing below image */
            }
        }
  </style>
  <div class="user-profile">
        <div class="user-pic">
            <a href="{{site.github_profile}}" target="_blank">
                <img src="{{site.baseurl}}/assets/res/user.png" alt="User Profile Picture">
            </a>
        </div>
        <div class="user-content">
            <div class="user-intro">
               <h4 class="hidden">I am a <span id="js-rotating">So Simple, Much Wow, Such Cool</span> Professor</h4>
            </div>
            <p>Professor, Hebei University of Technology</p>
            <p>State Key Laboratory of Reliability and Intelligence of Electrical Equipment</p>
            <p>Email: changgeng.zhang@hebut.edu.cn</p>
        </div>
    </div>
  {% include student-directory.html lang="en" %}
</div>
