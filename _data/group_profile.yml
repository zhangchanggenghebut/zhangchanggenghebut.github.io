en:
  name: Changgeng Zhang
  role: Professor and PhD Advisor, School of Electrical Engineering, Hebei University of Technology
  focus_label: Research interests
  focus: Engineering applications of electromagnetic fields · Magnetic property measurement · Modeling of magnetic materials · Manufacturing of soft magnetic composites
  details: Career and honors
  highlights:
    - Joined Hebei University of Technology in 2017 and served as lecturer, associate professor, and professor. Deputy Director of the Institute of Engineering Electromagnetics and Magnetic Technology.
    - Received the Hebei Provincial Outstanding Doctoral Dissertation Award.
    - Received first prize in the Hebei Provincial Science and Technology Progress Awards as the fourth-ranked contributor.
    - Fourth-ranked contributor to a Key Program project of the National Natural Science Foundation of China (NSFC) rated outstanding at completion.
    - Led NSFC Young Scientists Fund and General Program projects and participates in two ongoing NSFC Key Program projects.
zh:
  name: 张长庚
  role: 河北工业大学电气工程学院教授、博士生导师
  focus_label: 研究方向
  focus: 工程电磁场应用、磁特性测量、磁性材料建模、软磁复合材料制备
  details: 任职与荣誉
  highlights:
    - 2017 年起任职于河北工业大学，历任讲师、副教授、教授。现任工程电磁场与磁技术研究所副所长。
    - 获河北省优秀博士学位论文奖。
    - 获河北省科技进步奖一等奖，排名第四。
    - 参与的国家自然科学基金重点项目获优秀结题，排名第四。
    - 主持国家自然科学基金青年项目和面上项目，参与两项在研国家自然科学基金重点项目。
