- id: awards
  heading: {zh: 科研奖励, en: Research Awards}
  items:
    - zh: 河北省科技进步奖一等奖（2017 年），获奖项目为“电工磁材料的旋转磁特性测试技术与应用研究”。张长庚在 10 位完成人中排名第 4。
      en: First Prize, Hebei Provincial Science and Technology Progress Award (2017), for developing and applying techniques to measure the rotational magnetic properties of materials used in electrical engineering. Changgeng Zhang was the fourth of ten contributors.
    - zh: 电工理论与新技术学术年会优秀论文奖，哈尔滨，2021 年。
      en: Best Paper Award at the Annual Conference on Electrical Theory and New Technology, Harbin, 2021.
    - zh: 第十届电气工程前沿学术论坛优秀论文奖，2022 年。
      en: Best Paper Award at the 10th Frontier Academic Forum of Electrical Engineering, 2022.

- id: patents
  heading: {zh: 专利, en: Patents}
  items:
