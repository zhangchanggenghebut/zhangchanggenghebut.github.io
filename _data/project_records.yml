      date: '2022-11-01'
    - zh: 实用新型《复杂工况下阳极饱和电抗器铁芯磁特性测量装置及系统》。张长庚、王家俊、李永建、陈怡帆。
      en: 'Utility model. Device and system for measuring the magnetic properties of anode saturable reactor cores under complex operating conditions. Changgeng Zhang, Jiajun Wang, Yongjian Li and Yifan Chen.'
      number: CN210720703U
      date: '2020-06-09'
    - zh: 实用新型《一种在叠置方向施加应力的改进爱泼斯坦方圈》。张长庚、王家俊、李永建、李星汉，天津。
      en: 'Utility model. An improved Epstein frame for applying stress in the stacking direction. Changgeng Zhang, Jiajun Wang, Yongjian Li and Xinghan Li, Tianjin.'
      number: CN210626642U
      date: '2020-05-26'

- id: academic-activities
  heading: {zh: 特邀报告与学术服务, en: Invited Talks and Academic Service}
  items:
    - zh: 在 ASEMD 2023 国际会议上作大会特邀报告。
      en: Invited plenary speaker at ASEMD 2023.
    - zh: 在 ICEF 2021 国际会议上作 30 分钟特邀报告。
