instruments:
  - id: rotating
    name:
      zh: 旋转磁化测量仪
      en: Rotating magnetization tester
    origin:
      zh: 河北工业大学自制，中国
      en: Built at Hebei University of Technology, China
    sample:
      zh: 单片方形试样，22 × 22 mm
      en: Single square sheet, 22 × 22 mm
