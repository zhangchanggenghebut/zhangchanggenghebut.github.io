dalian_2026_equivalence:
- file: 2026/dalian-circuits-teaching/equivalent-transfer-functions-zh.webp
  file_en: 2026/dalian-circuits-teaching/equivalent-transfer-functions-en.webp
  width: 1920
  height: 1080
  zh: 报告课件节选。同一个网络函数可以写成多项式之比、因式分解式或部分分式。下方的反例展示了输出极性写反时应怎样给分。
  en: From the talk. A ratio of polynomials, a factored denominator and a partial-fraction expansion can describe the same transfer function. The example below the table shows how to assess a reversed output polarity.
dalian_2026_time:
- file: 2026/dalian-circuits-teaching/marking-time-zh.webp
  file_en: 2026/dalian-circuits-teaching/marking-time-en.webp
  width: 1920
  height: 1080
  zh: 报告课件节选。左表给出网络函数作业各评分点的平均得分，右表按环节列出 132 份作业的教师用时回溯记录。
  en: From the talk. The left table shows mean scores by criterion on the transfer-function assignment. The right table breaks down the instructor’s recorded time for 132 submissions.
dalian_2026_poster:
- file: 2026/dalian-circuits-teaching/ai-grading-poster.jpg
  width: 1280
  height: 1703
  zh: 张长庚在年会墙报《电路作业人机协同评价的评分量规与等价校验研究》前。
  en: Changgeng Zhang with the conference poster on grading rubrics and equivalence checks for instructor- and AI-assisted assessment of circuit homework.
masters_2024_adviser:
- file: 2024/masters-defences/adviser-and-four-students.jpg
  width: 1440
  height: 1292
  zh: 张长庚教授与四位硕士研究生在 2024 年 5 月 25 日答辩后合影。
  en: Prof. Changgeng Zhang with his four master’s students after their defences on 25 May 2024.
masters_2024_group:
- file: 2024/masters-defences/group-photo.jpg
  width: 1440
  height: 740
  zh: 参加本场硕士学位论文答辩的师生合影。
  en: Faculty and students at the master’s thesis defences.
masters_2024_album:
- file: 2024/masters-defences/defence-photo-1.jpg
  width: 1440
  height: 1080
  zh: 李锡正（中）与导师张长庚教授及在场教师合影。他的硕士论文研究叠片方向的压力如何影响电工钢片的磁特性。
  en: Xizheng Li (centre) with his supervisor, Prof. Changgeng Zhang, and faculty after his defence. His thesis examined how pressure perpendicular to electrical steel sheets affects their magnetic properties.
- file: 2024/masters-defences/defence-photo-2.jpg
  width: 1440
  height: 1080
  zh: 张妍（中）答辩后与教师合影。她从激光切边向钢片内部逐点测量，研究切割对无取向电工钢磁性能的影响范围。
  en: Yan Zhang (centre) with faculty after her defence. She measured how far magnetic degradation extends inward from a laser-cut edge in non-oriented electrical steel.
- file: 2024/masters-defences/defence-photo-3.jpg
  width: 1440
  height: 1080
  zh: 关舒月（中）手持答辩材料与教师合影。她的硕士论文将高速滑动电接触的实测磁场与仿真结果作了对照。
  en: Shuyue Guan (centre) holds her defence papers in a photograph with faculty. Her thesis compared measured and simulated magnetic fields around a high-speed sliding electrical contact.
masters_2025_defence:
- file: 2025/masters-defences/defence-photo-1.jpg
  width: 2048
  height: 1536
  zh: 牛国辰（中，手持鲜花）在硕士论文答辩后与导师张长庚教授及在场教师合影。他测量了垂直于叠片的压力对纳米晶、非晶合金磁滞回线和铁损的影响。
  en: Guochen Niu (centre, holding a flower) with his supervisor, Prof. Changgeng Zhang, and faculty after his master’s defence. He measured how pressure perpendicular to nanocrystalline and amorphous laminations changes their hysteresis loops and core losses.
- file: 2025/masters-defences/defence-photo-2.jpg
  width: 2048
  height: 1536
  zh: 张海涛（中，手持鲜花）在硕士论文答辩后与导师张长庚教授及在场教师合影。他用激光测振记录纳米晶叠片在一个磁化周期内的伸缩，并对不同激励波形下的应变进行了建模。
  en: Haitao Zhang (centre, holding a flower) with his supervisor, Prof. Changgeng Zhang, and faculty after his master’s defence. He used laser vibrometry to track how nanocrystalline laminations change length during a magnetisation cycle and modelled the strain under different excitation waveforms.
masters_2025_haitao:
- file: 2025/masters-defences/haitao-slide-16-zh.webp
  file_en: 2025/masters-defences/haitao-slide-16-en.webp
  width: 1920
  height: 1080
  zh: 张海涛答辩报告第 16 页。左、右两组分别为 5 kHz 和 15 kHz 下的实测磁致伸缩回线。每组四图依次显示占空比从 1.0 降至 0.2 的变化。
  en: Slide 16 of Haitao Zhang’s defence. The measured strain loops are grouped by frequency, 5 kHz on the left and 15 kHz on the right. In each group the duty cycle falls from 1.0 to 0.2.
masters_2025_guochen:
- file: 2025/masters-defences/guochen-slide-20-zh.webp
  file_en: 2025/masters-defences/guochen-slide-20-en.webp
